# Planned run matrices for the whole program (FIX_PLAN FX-5), as data. Priced by `python -m ape.budget`
# from config/budget_assumptions.yaml and config/model_costs.yaml; the FX-6 orchestrator reads the same file.
#
# Cells hold the values that will RUN, i.e. after the right-sizing cuts at the end of this file. Each cut
# records `from` -> `to` per edited field; `python -m ape.budget --uncut` prices the plan before the cuts.
#
# Cell kinds (default `agent`):
#   agent    one sample = one task. Fields: arms (list, or {arm: candidates}), cells, deliveries (default
#            [push]), n_tasks or worlds x tasks_per_world (per task cell), epochs; optional context (override,
#            tokens), exposure (retrieved | all). Gate run cells may name their worlds: split (default test)
#            and exception_style (default descriptive); see ape.run_gate's test phase.
#   build    one sample = one world. Fields: worlds {cell: count}, systems (default [apg, lightrag]);
#            gate build cells may set exception_style (F7 worlds; default descriptive).
#   session  Study G F8 sessions. Fields: arms, N (items per session), sessions (per arm), epochs; window and
#            threshold from `study_g` below; optional knobs {output_tokens, memo_density, dependency_density}
#            passed to the F8 generator (D-028: short sessions get larger tool files so they cross W).
#   anchor   GraphRAG-Bench questions: n_tasks per mode, modes.
#   fixed    a capped spend (usd).
# Every cell takes `profile` (config/models.yaml; default: the study's), optional `effort` (agent effort
# override, e.g. the low-effort capability points), optional `models` (role -> model overrides) and
# `enabled` (default true).

budget:
  total_usd: 5000
  # Per-study ceilings the orchestrators' budget guards enforce (with the program total). D-035 (2026-10-03): set to the
  # right-sized plan's conservative projection plus headroom (gate 214, main 1,013, study_g 3,483 -> 4,710); were the
  # FX-5 targets 700 / 1,000 / 2,700, under which the guard would have stopped Study G's topology cells. R-B4
  # (2026-10-03): ape.budget prices whole worlds as the runners run them (main 1,126.8 + the D-039 pilot re-runs the
  # runner reserves, 35.7 = 1,162.5, + ~5% headroom -> main 1,225). m5: the M5 add-on study (off by default; its
  # enabled cells project ~$123 conservative, the ledger arms at 1.5 x their team).
  allocations: {gate: 300, main: 1225, study_g: 3600, m5: 150}
  contingency_usd: 1000
  # Per-sample runaway guard (Inspect `cost_limit`, set by ape.runner): multiple x the cell's conservative
  # per-sample projection, at least floor_usd; default_usd where no projection is passed. A sample that hits it
  # ends with limit "cost" and counts as a cap hit (PC5). Only applied when every model of the run is priced.
  sample_cost_limit: {multiple: 20, floor_usd: 0.50, default_usd: 2.00}
  # Per-sample runaway wall-clock guard of the main study and Study G (BUILD_PLAN B12, brief §4.5; Inspect
  # `working_limit`, set by ape.run_study on every task it builds, never by the gate): agent_s seconds at the default
  # agent_turns turn cap, scaled with a task's own turn cap; an F8 session of N cases gets session_base_s + N x
  # session_per_case_s. Not an experimental cap: a sample that hits it ends with limit "working", a limit hit like
  # the cost guard's. Part of the main and Study G freeze slices (ape.freeze_scope), not the gate's.
  sample_working_limit: {agent_s: 1800, agent_turns: 12, session_base_s: 1800, session_per_case_s: 600}

study_g:
  window: 32000      # nominal W, harness-enforced, identical across tiers (was 64K)
  threshold: 20000   # absolute compaction threshold T_abs (was 40K)

studies:
  # ------------------------------------------------------------------------------------------------
  gate:
    profile: gate   # agent Luna high, kg Luna low, build Luna high (D-015, D-017)
    phases:
      smoke:
        - {id: gate.smoke, kind: fixed, usd: 3.4, note: "readiness/smoke.py (--max-usd 4): gate checks $2.95 incl. E3 probes + the main and Study G arm-family checks $0.41 (D-046)"}
      anchor:
        - {id: gate.anchor.index, kind: build, profile: anchor, worlds: {anchor-medical: 1}, systems: [lightrag],
           note: "PC1 LightRAG index, paper model gpt-4o-mini (D-009)"}
        - {id: gate.anchor.runs, kind: anchor, profile: anchor, n_tasks: 766, n_per_type: 200, modes: [hybrid, naive],
           note: "200 per type, all 166 Creative Generation (D-010); answer + 3 judge calls; PC1 compares hybrid with naive"}
      builds:
        # D-017: Luna builder; ~550 chunks per F7-1000 world, ~68 per F3-60, ~8 for small worlds.
        - {id: gate.build.dev, kind: build, worlds: {F7-10: 2, F7-1000: 2, F3-5: 2, F3-60: 2},
           note: "tuning worlds; D-017 build-quality check"}
        - {id: gate.build.dev-messy, kind: build, worlds: {F7-10: 1, F7-1000: 1}, exception_style: messy,
           note: "messy-exception dev worlds"}
        - {id: gate.build.dev-id-only, kind: build, worlds: {F7-10: 2, F7-1000: 2}, exception_style: id_only,
           note: "paired id_only renderings of the gate.build.dev F7 worlds (same seeds)"}
        - {id: gate.build.dev-f5, kind: build, worlds: {F5-1hop: 2, F5-2hop: 2}, note: "F5 dev worlds for PC2 dev-side checks"}
        - {id: gate.build.pilot, kind: build, worlds: {F7-10: 8, F7-1000: 8, F3-5: 8, F3-60: 8},
           note: "worlds 1-4: every pilot cell; worlds 5-8: gate.pilot.sigma only (D-026)"}
        - {id: gate.build.test, kind: build, worlds: {F7-10: 16, F7-1000: 16, F3-5: 16, F3-60: 16}}
        - {id: gate.build.test-id-only, kind: build, worlds: {F7-10: 9, F7-1000: 9}, exception_style: id_only,
           note: "paired id_only renderings of 9 test seeds per F7 cell (>= 100 tasks)"}
        - {id: gate.build.test-f5, kind: build, worlds: {F5-1hop: 9, F5-2hop: 9}}
      tuning:
        - {id: gate.tune, arms: {APG-s: 4, APG-q: 2, LGR-s: 4, LGR-q: 2, S3s: 3}, cells: [F7-10, F7-1000, F3-5, F3-60],
           worlds: 2, tasks_per_world: 12, epochs: 1, note: "15 candidates (config/tuning_grid.yaml) x 4 dev cells x 24 tasks"}
      pilot:
        - {id: gate.pilot, arms: [APG*, LGR*, S3s, S1, S5o, S6, S7], cells: [F7-10, F7-1000, F3-5, F3-60],
           worlds: 4, tasks_per_world: 12, epochs: 1}
        - {id: gate.pilot.pull, arms: [APG*, LGR*, S3s], cells: [F7-10, F7-1000], deliveries: [pull],
           worlds: 4, tasks_per_world: 12, epochs: 1, note: "calibrates pull-mode calls and tokens"}
        - {id: gate.pilot.sigma, arms: [APG*, LGR*], cells: [F7-10, F7-1000, F3-5, F3-60], worlds: 4, world_offset: 4,
           tasks_per_world: 12, epochs: 1, note: "pilot worlds 5-8, push: sigma_w/sigma_g from 8 worlds per cell (D-026)"}
        - {id: gate.pilot.budget-cal, arms: [LGR*, S3s], cells: [F7-10, F7-1000, F3-5, F3-60], worlds: 2,
           tasks_per_world: 12, epochs: 1, context: 300, note: "caps landing within +-25% of 300 tokens (PC4)"}
      test:
        - {id: gate.test.f7, arms: [APG*, LGR*, S3s], cells: [F7-10, F7-1000], deliveries: [push, pull],
           worlds: 16, tasks_per_world: 12, epochs: 3, note: "primary; push and pull co-primary (D-016)"}
        - {id: gate.test.f3, arms: [APG*, LGR*, S3s], cells: [F3-5, F3-60], worlds: 16, tasks_per_world: 12, epochs: 3,
           note: primary}
      diagnostics:
        - {id: gate.diag, arms: [S1, S5o, S6], cells: [F7-10, F7-1000, F3-5, F3-60], n_tasks: 100, epochs: 2}
        - {id: gate.diag.s7, arms: [S7], cells: [F7-10, F7-1000, F3-5, F3-60], n_tasks: 100, epochs: 3,
           note: "placebo; in the GO rule, keeps 3 epochs"}
      f5:
        - {id: gate.f5, arms: [APG*, LGR*, LGR-naive], cells: [F5-1hop, F5-2hop], n_tasks: 100, epochs: 2,
           note: "PC2 and F5 report; never pooled"}
      secondaries:
        - {id: gate.sec.id-only, arms: [APG*, LGR*, S3s], cells: [F7-10, F7-1000], deliveries: [push, pull],
           n_tasks: 100, epochs: 2, exception_style: id_only, note: "on the gate.build.test-id-only worlds"}
        - {id: gate.sec.matched-300, arms: [APG*, LGR*, S3s], cells: [F7-10, F7-1000, F3-5, F3-60], n_tasks: 100,
           epochs: 2, context: 300, note: "one matched budget, ~300 tokens (was 300 and 2,000)"}
        - {id: gate.sec.te-all, arms: [APG*, LGR*, S3s], cells: [F3-5, F3-60], n_tasks: 100, epochs: 2, exposure: all}
        - {id: gate.sec.messy, arms: [APG*, LGR*, S3s], cells: [F7-10, F7-1000], n_tasks: 50, epochs: 2,
           split: dev, exception_style: messy, note: "dev diagnostic on the 2 messy worlds (gate.build.dev-messy)"}

  # ------------------------------------------------------------------------------------------------
  main:
    profile: main_luna   # ORCHESTRATOR_BRIEF_v2 §7.2: primary tier Luna; replication Luna/Sol (Study G owns Astra)
    phases:
      builds:
        - {id: main.build.kg, kind: build, systems: [apg],
           worlds: {F7-10: 11, F7-100: 11, F7-1000: 11, F3-5: 11, F3-60: 11, F1-2: 11, F1-32: 11},
           note: "KG arm (S5, M1k, M2) graphs: 9 test + 2 pilot worlds per KG condition; LightRAG instead if the gate is NO-GO. F7-100 (Study F, both tiers) and F1-2 (micro-pilot S5) added by D-028"}
      micro_pilot:
        - {id: main.micro-pilot, arms: [S1, S5, M1], cells: [F1-2, F1-32, F7-10, F7-1000], n_tasks: 20, epochs: 2,
           note: "brief §7.1; S5 on F1 as the KG-on-F1 probe"}
      tuning:
        - {id: main.tune.a, arms: {M1: 4, M7: 4}, cells: [F1-32, F2-10], n_tasks: 20, epochs: 1,
           note: "D-047: S9 runs under M1's selection (one protocol variant for S9 and the M1 chain), so it is not tuned"}
        - {id: main.tune.b, arms: {M1: 4}, cells: [F3-60, F7-1000], n_tasks: 20, epochs: 1,
           note: "D-041: S3s and S5 inherit the gate's selections (same profile and dev worlds); not re-tuned. D-047: M1k and M2 run under M1's selection, so M1 alone tunes here"}
      pilot:
        - {id: main.pilot.a, arms: [S1, S9, M1, M7], cells: [F1-2, F1-32, F2-2, F2-10], n_tasks: 20, epochs: 1}
        - {id: main.pilot.b, arms: [S1, S3s, S5, S7, M1, M1k, M2], cells: [F3-5, F3-60, F7-10, F7-1000],
           n_tasks: 20, epochs: 1}
      study_a:
        - {id: main.A.s1-pool, arms: [S1], cells: [F1-2, F1-32, F2-2, F2-10], n_tasks: 100, epochs: 8,
           note: "8-run S1 pool -> S8 frontier; S1's 3 epochs drawn from it"}
        - {id: main.A.arms, arms: [S9, M1, M7], cells: [F1-2, F1-32, F2-2, F2-10], n_tasks: 100, epochs: 3}
        - {id: main.A.m1s, arms: [M1s], cells: [F1-32], n_tasks: 50, epochs: 3}
      study_b:
        - {id: main.B.s1-pool, arms: [S1], cells: [F3-5, F3-60, F7-10, F7-1000], n_tasks: 100, epochs: 8}
        - {id: main.B.arms, arms: [S3s, S5, S7, M1, M1k, M2], cells: [F3-5, F3-60, F7-10, F7-1000],
           n_tasks: 100, epochs: 3}
      study_c:
        - {id: main.C.a, arms: [S1, M1, M7], cells: [F1-2, F1-32, F2-2, F2-10], n_tasks: 15, epochs: 2,
           note: "+2 epochs on 15 tasks per MVS condition (brief: ~120 tasks)"}
        - {id: main.C.b, arms: [S1, S5, M1, M2], cells: [F3-5, F3-60, F7-10, F7-1000], n_tasks: 15, epochs: 2}
        - {id: main.C.s8, arms: [S8k3], cells: [F1-2, F1-32, F2-2, F2-10, F3-5, F3-60, F7-10, F7-1000], n_tasks: 15, epochs: 5,
           note: "D-044: the live S8k3 runs only in Study C, so it gets all 5 runs here (brief: Study C totals 5 per arm)"}
      study_f:
        - {id: main.F.luna, arms: [S5], cells: [F1-32], n_tasks: 100, epochs: 3,
           note: "Luna cells not already in Studies A/B (S1, M1 on F1-32 and all four on F7-1000 are reused); M2 dropped on F1 (D-034)"}
        - {id: main.F.luna-f7-100, arms: [S1, S5, M1, M2], cells: [F7-100], n_tasks: 100, epochs: 3,
           note: "D-028: Luna at the same KB size as main.F.sol, so the tier contrast (H6) is not confounded with KB size"}
        - {id: main.F.sol, profile: main_sol, arms: [S1, S5, M1], cells: [F1-32, F7-100], n_tasks: 60, epochs: 3,
           note: "tier replication on Sol (3 arms x 2 families x 3 epochs); F7-100 not F7-1000: KB scaling is K4's question (Luna), and the 83K monolith x Sol price dominated the budget"}
        - {id: main.F.sol-m2, profile: main_sol, arms: [M2], cells: [F7-100], n_tasks: 60, epochs: 3,
           note: "D-034: M2 on F7 only (specialization is undefined on F1: routing to segment specialists is blind)"}

  # ------------------------------------------------------------------------------------------------
  study_g:
    profile: study_g_luna   # CONTEXT_MANAGEMENT_AUDIT §8 as right-sized by FX-5; Tier B excluded
    phases:
      micro_pilot:
        - {id: g.pilot.luna, kind: session, arms: [CM0, CM-prune, CM-sum, CM-todo, CM-reset, CM-native, O-state],
           N: 40, sessions: 3, epochs: 1, note: "~3 sessions per arm at one tier (audit §8)"}
        - {id: g.pilot.topo, kind: session, arms: [S1, M1, M2, S-CM*], N: 20, knobs: {output_tokens: 2250}, sessions: 2, epochs: 1,
           note: "D-047: the topology arms (the largest cost) piloted before the freeze, as g.topo.luna runs them; S-CM* at its default stack (before tuning)"}
      tuning:
        - {id: g.tune.luna, kind: session, arms: {CM-prune: 3, CM-sum: 2, CM-todo: 2, CM-reset: 3, S-CM*: 3},
           N: 40, sessions: 3, epochs: 1, note: "equal dev budget per strategy (audit §6.3)"}
      capability_anchor:
        # Measured capability per point (audit §2.1): the baseline on F7-10 + F3-5, short-horizon.
        - {id: g.cap.luna-high, arms: [S1], cells: [F7-10, F3-5], n_tasks: 48, epochs: 1}
        - {id: g.cap.luna-low, effort: low, arms: [S1], cells: [F7-10, F3-5], n_tasks: 48, epochs: 1}
        - {id: g.cap.sol-high, profile: study_g_sol, arms: [S1], cells: [F7-10, F3-5], n_tasks: 48, epochs: 1}
        - {id: g.cap.sol-low, profile: study_g_sol, effort: low, arms: [S1], cells: [F7-10, F3-5], n_tasks: 48,
           epochs: 1, enabled: false}
        - {id: g.cap.astra-high, profile: study_g_astra, arms: [S1], cells: [F7-10, F3-5], n_tasks: 48, epochs: 1}
      context_management:
        - {id: g.cm.luna-high, kind: session, arms: [CM0, CM-prune, CM-sum, CM-todo, CM-reset, CM-native, O-state],
           N: 40, sessions: 10, epochs: 3}
        - {id: g.cm.luna-low, kind: session, effort: low, arms: [CM0, CM-sum, CM-todo, O-state], N: 40, sessions: 10,
           epochs: 3, note: "Luna-low capability point, the 4 arms common to every point"}
        - {id: g.cm.luna-n10, kind: session, arms: [CM0, O-state], N: 10, sessions: 10, epochs: 3,
           note: "short-session control (audit §8), Luna only"}
        - {id: g.cm.sol-high, kind: session, profile: study_g_sol, arms: [CM0, CM-native, CM-sum, CM-todo, O-state],
           N: 40, sessions: 8, epochs: 1,
           note: "D-043: CM-native replaces CM-prune at Sol (a second tier for native compaction). Needs the probe's confirmed
             Sol support record; if the probe says unsupported, put CM-prune back here before the freeze (a plan change, not a deviation)"}
        - {id: g.cm.sol-low, kind: session, profile: study_g_sol, effort: low, arms: [CM0, CM-sum, CM-todo, O-state],
           N: 40, sessions: 8, epochs: 2, enabled: false}
        - {id: g.cm.astra-high, kind: session, profile: study_g_astra, arms: [CM0, CM-sum, CM-todo, O-state],
           N: 24, sessions: 6, epochs: 1, knobs: {output_tokens: 1750}}
      topology:
        - {id: g.topo.luna, kind: session, arms: [S1, M1, M2, S-CM*], N: 20, sessions: 16, epochs: 2, knobs: {output_tokens: 2250},
           note: "D-033: 8 -> 16 sessions (G-H3a/G-H3b power)"}
        - {id: g.topo.luna-low, kind: session, effort: low, arms: [S1, M1, M2, S-CM*], N: 20, sessions: 16, epochs: 2,
           knobs: {output_tokens: 2250}, note: "D-033: a fourth topology capability point (Luna-low), for G-H3 and the G-H1 estimate"}
        - {id: g.topo.sol, kind: session, profile: study_g_sol, arms: [S1, M1, M2, S-CM*], N: 20, sessions: 12, epochs: 1,
           knobs: {output_tokens: 2250}}
        - {id: g.topo.astra, kind: session, enabled: false, profile: study_g_astra, arms: [S1, M2], N: 20, sessions: 5, epochs: 2,
           knobs: {output_tokens: 2250},
           note: "D-051 (user): not run. It fed only G-H1's descriptive S1-pre sensitivity at Astra; G-H1's S-CM* reference and G-H3 never used Astra (-$939 conservative)"}

  # ------------------------------------------------------------------------------------------------
  # The M5 add-on study (user-approved): a Magentic-style ledger orchestrator, M5 = M1 + ledger and M5-spec = M2 +
  # ledger. OFF by default (every cell `enabled: false`): enabled, it runs on its own, beside or after the main study,
  # with `python -m ape.run_study <phase> --study m5 --run-id <id> --main-run-id <frozen main run>`. It inherits the
  # frozen main run's design (test-seed block, token caps and their multiple, gate resolution, M1's selection, the
  # working- and cost-limit rules) and runs on the main run's pilot and test worlds, paired on the same tasks; it
  # builds no worlds. Fresh concurrent M1 and M2 controls run with it.
  m5:
    profile: main_luna
    phases:
      pilot:
        - {id: m5.pilot.a, enabled: false, arms: [M5], cells: [F2-10], n_tasks: 20, epochs: 1, note: "on main's pilot worlds, at main's frozen caps"}
        - {id: m5.pilot.b, enabled: false, arms: [M5-spec], cells: [F3-60], n_tasks: 20, epochs: 1, note: "on main's pilot worlds, at main's frozen caps"}
      test:
        - {id: m5.test.a, enabled: false, arms: [M5, M1], cells: [F1-2, F1-32, F2-2, F2-10], n_tasks: 100, epochs: 3,
           note: "M5 with a fresh concurrent M1 control, on main's test worlds (Study A's cells)"}
        - {id: m5.test.b, enabled: false, arms: [M5-spec, M2], cells: [F3-5, F3-60, F7-10, F7-1000], n_tasks: 100, epochs: 3,
           note: "M5-spec with a fresh concurrent M2 control, on main's test worlds (Study B's cells)"}

# Right-sizing cuts (FX-5), applied IN ORDER while the conservative total exceeded budget.total_usd, stopping as
# soon as it fit. `applied` cuts are already reflected in the cells above. Never cut: gate primary sizes, epochs of
# primary cells, the S7 placebo. Conservative totals with the priors (2026-10-01): uncut $6,530 -> C1 $6,058 ->
# C2 $5,857 -> C3 $5,305 -> C4 $5,117 -> C5 $4,561 (fits; C6 not needed). C5 was needed by $117 only: revisit it
# after the gate pilot recalibrates (Study F runs after the gate).
cuts:
  - id: C1
    applied: true
    what: Drop the Sol-low capability point (Study G)
    set:
      - {cell: g.cm.sol-low, field: enabled, from: true, to: false}
      - {cell: g.cap.sol-low, field: enabled, from: true, to: false}
    quality: >-
      The capability axis keeps 4 points (Luna low, Luna high, Sol high, Astra high) instead of 5, and the
      effort-vs-model contrast exists at Luna only. The strategy x capability interactions (G-H1 slope,
      G-H2 TOST) rest on 4 points, with wider CIs and less power for slope differences.
  - id: C2
    applied: true
    what: Study G Sol context-management epochs 2 -> 1 (8 sessions; D-052, was sessions 8 -> 6)
    set:
      - {cell: g.cm.sol-high, field: epochs, from: 2, to: 1}
    quality: >-
      D-052: Sol CM cells run 8 sessions x 1 epoch per arm (uncut 8 x 2; the earlier version of this cut ran 6 x 2).
      Sessions are the clusters, so one epoch with more sessions keeps Sol's G-H2a power at 1.00 for half the uncut
      cost (g_power, robust to 2.5x the epoch-noise prior); whole-session pass^k is not available at Sol.
  - id: C3
    applied: true
    what: Study G Astra context-management 6 sessions x 1 epoch and N 30 -> 24 (D-052, was 4 x 2)
    set:
      - {cell: g.cm.astra-high, field: sessions, from: 5, to: 6}
      - {cell: g.cm.astra-high, field: epochs, from: 2, to: 1}
      - {cell: g.cm.astra-high, field: N, from: 30, to: 24}
    quality: >-
      D-052: Astra CM cells run 6 sessions x 1 epoch per arm (was 4 x 2): more clusters raise G-H2a's Astra power
      from 0.94 to 0.99 at 25% less cost than 4 x 2 (g_power, robust to 2.5x the epoch-noise prior); whole-session
      pass^k is not available at Astra, and item-level estimates rest on 20% fewer items per session. Sessions of 24 items still cross W = 32K around mid-session, but
      Astra's degradation curve spans positions 1-24 (Luna/Sol 1-40) and loses the item-30 probe.
  - id: C4
    applied: false  # not needed once Study F Sol moved to F7-100 (review 2026-10-01): in-order minimum is C1-C3
    what: Study G Astra topology sessions 5 -> 4
    set:
      - {cell: g.topo.astra, field: sessions, from: 5, to: 4}
    quality: >-
      Astra S1 vs M2 (G-H1 at the top tier, already 2 arms only) rests on 4 sessions x 2 epochs per arm;
      CIs widen by about 1.12x.
  - id: C5
    applied: true  # D-052 (user): T1 is descriptive since D-033; Sol at 60 tasks (5 worlds) on F1-32 and F7-100
    what: Main-study Study F Sol tasks 100 -> 60
    set:
      - {cell: main.F.sol, field: n_tasks, from: 100, to: 60}
    quality: >-
      Sol tier replication (H6, `success ~ arm * tier`) uses 60 tasks x 3 epochs per arm and family. The
      within-condition MDE rises from about 13-15 pp to about 17-19 pp; Luna keeps n = 100, so arm x tier
      interactions are estimated less precisely on the Sol side only.
  - id: C6
    applied: false
    what: Gate matched-budget secondary 100 -> 60 tasks per cell
    set:
      - {cell: gate.sec.matched-300, field: n_tasks, from: 100, to: 60}
    quality: Descriptive secondary only; per-cell matched-budget CIs would widen by about 1.3x.
