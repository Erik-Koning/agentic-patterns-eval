# PLACEHOLDER (BUILD_PLAN B1). This is NOT Study G's tuning grid. Package B11 declares the real one: equal dev budgets
# for CM-prune, CM-sum, CM-todo, CM-reset and S-CM* (CONTEXT_MANAGEMENT_AUDIT §6.3), each system's candidates (its
# APE_CM_* knobs, ape.agent.cm_arms) declared by its owner, with the owners' sign-off. Until then this grid gives every
# built context-management arm one candidate at its defaults (S-CM* also a trim stack, and CM-trim, which no plan cell
# names, its own system), so an offline `python -m ape.run_study all --study study_g --offline` exercises every arm's
# tuning path end to end. A live tune refuses it (`placeholder: true`, and no owner has signed off).
#
# Format: as config/tuning_grid_main.yaml. A dev cell `F8-<N>` (or `F8-<N>-<knob tag>`, gen_f8.variant_tag) tunes on
# that session variant's dev sessions; candidates are scored by mean item success (f8_session_score). The arms share
# APE_CM_* knobs (todo_extract, reset_every, ...): when two selections set the same knob to different values, the
# runner runs each tuned arm in an eval set of its own, under its own selection's knobs (ape.run_study `env_group`).
placeholder: true
owners: {CM-prune: TODO, CM-trim: TODO, CM-sum: TODO, CM-todo: TODO, CM-reset: TODO, S-CM*: TODO}
signed_off: {CM-prune: false, CM-trim: false, CM-sum: false, CM-todo: false, CM-reset: false, S-CM*: false}
budget_per_system: 3
tie_pp: 1.0
dev_cells: [F8-40]

systems:
  CM-prune:
    candidates:
      - {id: prune-default, arm: CM-prune, env: {}}
  CM-trim:
    candidates:
      - {id: trim-default, arm: CM-trim, env: {}}
  CM-sum:
    candidates:
      - {id: sum-default, arm: CM-sum, env: {}}
  CM-todo:
    candidates:
      - {id: todo-default, arm: CM-todo, env: {}}
  CM-reset:
    candidates:
      - {id: reset-default, arm: CM-reset, env: {}}
  S-CM*:
    candidates:
      - {id: scm-default, arm: S-CM*, env: {}}
      - {id: scm-trim, arm: S-CM*, env: {APE_CM_STACK: trim+todo+reset}}
