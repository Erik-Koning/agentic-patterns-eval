# Model roles per run profile (DECISIONS D-015, D-017; FIX_PLAN FX-1). Loaded by `ape.models`.
# Pick a profile with `--profile` on the CLIs or APE_MODEL_PROFILE (default: gate).
#
# Roles:
#   agent           the eval's main model (Inspect --model)
#   kg              APG classify and LightRAG keyword extraction (Inspect role "kg")
#   judge           GraphRAG-Bench anchor ACC judge (Inspect role "judge")
#   build           APG authoring and LightRAG extraction (OpenAI SDK, outside Inspect; bare model name)
#   build_fallback  D-017 fallback builder, selected with APE_BUILD_FALLBACK=1
#   embeddings      chunk, node and query embeddings (OpenAI SDK; bare model name)
#   probe           optional, Study G only: F8 forked state probes (ape.agent.session). Unset (the default), the
#                   agent's own model and effort answer, as the budget assumes: a probe asks what the model in
#                   the session can recall, so another model would measure the wrong thing. Set it only for a
#                   deliberate sensitivity run. Probe tokens are recorded per probe and excluded from cost.
# Each role takes `model` and optional `reasoning_effort`, `max_tokens`, `temperature`, `top_p`, `seed`.
# Sampling fields are only for models that accept them (the anchor's gpt-4o-mini); gate profiles never set them.
# Inspect model IDs must match config/model_costs.yaml (confirmed by readiness/probe_openai.py, E3).
#
# Optional per-profile `concurrency:` (FX-3; read by ape.runner.run_evals). Omitted fields take these defaults:
#   max_connections  16  concurrent API calls per Inspect model (agent and each role); null = Inspect's adaptive controller
#   max_samples      32  samples in flight per task
#   max_tasks         2  tasks in flight at once
# Conservative until FX-8's concurrency probe tunes them. Profiles inheriting with `<<: *gate` inherit it whole.

profiles:
  gate: &gate
    concurrency: {max_connections: 16, max_samples: 32, max_tasks: 2}
    agent: {model: openai/gpt-6-luna, reasoning_effort: high}
    kg: {model: openai/gpt-6-luna, reasoning_effort: low}
    judge: {model: openai/gpt-6-luna, reasoning_effort: low}
    build: {model: gpt-6-luna, reasoning_effort: high}
    build_fallback: {model: gpt-6-sol, reasoning_effort: medium}
    embeddings: {model: text-embedding-3-small}

  # Study G tiers (D-015: all at high). Low-effort capability points override the agent effort per cell
  # in config/run_plan.yaml (FX-5).
  # The kg, judge, build and embedding roles stay as in the gate, so only the agent varies.
  study_g_luna:
    <<: *gate
  study_g_sol:
    <<: *gate
    agent: {model: openai/gpt-6-sol, reasoning_effort: high}
  study_g_astra:
    <<: *gate
    agent: {model: openai/gpt-6-astra, reasoning_effort: high}

  # Main study (ORCHESTRATOR_BRIEF_v2 §7.2, FX-5): primary tier Luna; Study F replicates on Sol only
  # (Study G owns the Astra tier). Only the agent varies.
  main_luna:
    <<: *gate
  main_sol:
    <<: *gate
    agent: {model: openai/gpt-6-sol, reasoning_effort: high}

  # GraphRAG-Bench anchor (precondition PC1). Paper-faithful: gpt-4o-mini answers at temperature 0.7,
  # judged at temperature 0 / top_p 1 / seed 42, index built by gpt-4o-mini. Tolerance ±5 pp.
  anchor:
    <<: *gate
    agent: {model: openai/gpt-4o-mini, temperature: 0.7}
    judge: {model: openai/gpt-4o-mini, temperature: 0.0, top_p: 1.0, seed: 42}
    build: {model: gpt-4o-mini}
  # Fallback when gpt-4o-mini is retired (E3 decides): GPT-6 Luna without sampling parameters. Tolerance ±10 pp.
  anchor_luna:
    <<: *gate
    agent: {model: openai/gpt-6-luna, reasoning_effort: low}
    judge: {model: openai/gpt-6-luna, reasoning_effort: low}
    build: {model: gpt-6-luna, reasoning_effort: high}
