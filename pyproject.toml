[project]
name = "ape"
version = "0.1.0"
description = "Agentic patterns eval: APG vs LightRAG suitability gate and mechanism-attribution harness"
requires-python = ">=3.14,<3.15"
dependencies = [
    "inspect-ai",
    "openai",
    "tiktoken",
    "lightrag-hku==1.5.7",
    "apg-core",
    "rank-bm25",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "jsonschema",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
    "huggingface-hub>=1.33",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio"]

[tool.uv.sources]
# Pinned to the annotated tag apg-eval-baseline (commit d47f7f3); uv.lock records the commit SHA.
# Local repository URL until APG has a remote; then swap the URL and keep the tag.
apg-core = { git = "file:///Users/erikkoning/Documents/Work/Code/EvolvingWisdomAgents", subdirectory = "python/packages/apg-core", tag = "apg-eval-baseline" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
