[project]
name = "ape"
version = "0.1.0"
description = "Agentic patterns eval: APG vs LightRAG suitability gate and mechanism-attribution harness"
requires-python = ">=3.14,<3.15"
dependencies = [
    "inspect-ai",
    "openai",
    "tiktoken",
    "lightrag-hku==1.5.7",
    "apg-core",
    "rank-bm25",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "jsonschema",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio"]

[tool.uv.sources]
# Non-editable: the installed copy is frozen at install time; PROVENANCE.md records its tree hash.
apg-core = { path = "../Code/EvolvingWisdomAgents/python/packages/apg-core", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
